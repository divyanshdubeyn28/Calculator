<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divyansh Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient-glow"></div>
  <main class="calculator" aria-label="Calculator">
    <!-- Header with logo and branding -->
    <header class="calc-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 18V6a2 2 0 0 1 2-2h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6"></path>
          <path d="M11 14h5a3 3 0 0 1 3 3v1a0 0 0 0 1 0 0h-8a0 0 0 0 1 0 0z"></path>
        </svg>
      </div>
      <div class="brand-divider"></div>
      <div class="brand-title">
        <span class="brand-name">DIVYANSH</span>
        <span class="brand-sub">CALCULATOR</span>
      </div>
      <div class="header-indicator"></div>
    </header>

    <!-- Screen Display -->
    <section class="display" aria-live="polite">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </section>

    <!-- Keypad -->
    <section class="keys">
      <button class="btn fn" data-action="clear">AC</button>
      <button class="btn fn" data-action="delete">DEL</button>
      <button class="btn fn" data-action="percent">%</button>
      <button class="btn op" data-op="/">÷</button>

      <button class="btn" data-num="7">7</button>
      <button class="btn" data-num="8">8</button>
      <button class="btn" data-num="9">9</button>
      <button class="btn op" data-op="*">×</button>

      <button class="btn" data-num="4">4</button>
      <button class="btn" data-num="5">5</button>
      <button class="btn" data-num="6">6</button>
      <button class="btn op" data-op="-">−</button>

      <button class="btn" data-num="1">1</button>
      <button class="btn" data-num="2">2</button>
      <button class="btn" data-num="3">3</button>
      <button class="btn op" data-op="+">+</button>

      <button class="btn" data-action="sign">+/−</button>
      <button class="btn" data-num="0">0</button>
      <button class="btn" data-action="decimal">.</button>
      <button class="btn eq" data-action="equals">=</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
